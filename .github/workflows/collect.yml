name: collect

on:
  schedule:
    # 5분마다 실행. 매시 정각은 GitHub이 혼잡하므로 2분씩 비켜서 돈다(시각은 UTC 기준).
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write # 본 글 기록을 state 브랜치에 저장하는 데 필요

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: 상태 복원
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --quiet --depth=1 origin state
            git show FETCH_HEAD:state.json > "$RUNNER_TEMP/state.json"
            git rev-parse FETCH_HEAD:state.json > "$RUNNER_TEMP/state.blob"
          else
            rc=$?
            # 2는 "state 브랜치가 아직 없음"(첫 실행). 그 밖의 값은 통신 오류이므로 멈춘다.
            if [ "$rc" -ne 2 ]; then
              echo "상태 브랜치를 확인하지 못함 (종료 코드 $rc)"
              exit 1
            fi
            echo '{}' > "$RUNNER_TEMP/state.json"
            : > "$RUNNER_TEMP/state.blob"
          fi

      - name: 수집과 알림
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: STATE_FILE="$RUNNER_TEMP/state.json" node src/collect.mjs

      - name: 상태 저장
        run: |
          blob=$(git hash-object -w "$RUNNER_TEMP/state.json")
          if [ "$blob" = "$(cat "$RUNNER_TEMP/state.blob")" ]; then
            echo "상태 변경 없음"
            exit 0
          fi
          # 부모 없는 커밋 하나로 덮어써서 state 브랜치의 기록이 쌓이지 않게 한다.
          tree=$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree)
          commit=$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" -m 'state')
          git push --quiet --force origin "$commit:refs/heads/state"
